name: Publish submitted prompts

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '### Use case and purpose')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish new form submission
        if: github.event_name == 'issues'
        run: node scripts/publish-issue-prompts.mjs "$GITHUB_EVENT_PATH"
      - name: Load current form submissions
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > prompt-issues.json
      - name: Publish current form submissions
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/publish-issue-prompts.mjs prompt-issues.json
      - name: Build prompt index
        run: node scripts/build-prompt-index.mjs
      - name: Build catalog data
        run: node scripts/build-catalog.mjs
      - name: Commit prompt records and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompts docs/catalog.json
          git diff --cached --quiet || git commit -m "Publish submitted prompts"
          git push
