name: Submit a Codex prompt
description: Share a reusable Codex prompt with the Strategic Install RA community.
title: "Prompt: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Do not include customer data, credentials, personal data, or non-public source content. Use placeholders for variable information. Your submission creates a prompt record in the library automatically.
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the closest primary use case.
      options:
        - Analysis
        - Customer preparation
        - Data and reporting
        - Project management
        - Research
        - Technical work
        - Writing and communication
        - Other
    validations:
      required: false
  - type: textarea
    id: use-case
    attributes:
      label: Use case and purpose
      description: Explain when to use this prompt, what problem it solves, and any limits.
      placeholder: This prompt is used when...
    validations:
      required: false
  - type: textarea
    id: prompt-text
    attributes:
      label: Prompt text
      description: Paste the complete reusable prompt. Replace sensitive or variable information with placeholders.
      render: text
    validations:
      required: false
  - type: textarea
    id: required-inputs
    attributes:
      label: Required inputs
      description: List each input needed before running the prompt. Enter `None` when no input is required.
      placeholder: |
        - Source document or file path
        - Reporting period
        - Intended audience
    validations:
      required: false
  - type: textarea
    id: expected-output-next-steps
    attributes:
      label: Expected output and next steps
      description: State what Codex should produce, how to validate it, and what action follows.
    validations:
      required: false
  - type: textarea
    id: additional-instructions-notes
    attributes:
      label: Additional instructions and notes
      description: Add context, constraints, setup guidance, usage notes, or any other information users should consider.
      placeholder: Add any instructions or notes that will help someone use this prompt.
    validations:
      required: false
  - type: dropdown
    id: demo-recommended
    attributes:
      label: Is a demo recommended?
      description: Select Yes when a recording would materially improve adoption or correct use.
      options:
        - "No"
        - "Yes"
    validations:
      required: false
  - type: input
    id: demo-recording
    attributes:
      label: Demo recording
      description: Provide a durable internal recording link, if available.
      placeholder: https://...
    validations:
      required: false
  - type: input
    id: contributor-name
    attributes:
      label: Your name
      description: Include the person who can answer follow-up questions.
    validations:
      required: false
  - type: input
    id: contributor-email
    attributes:
      label: Your work email
      description: Include a work email for questions or improvement requests.
      placeholder: name@company.com
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I tested this prompt and the required inputs are accurate.
          required: false
        - label: I removed customer data, credentials, personal data, and non-public source content.
          required: false
